workflows:
  ios-workflow:
    name: iOS Build
    environment:
      vars:
        XCODE_WORKSPACE: "Chat/Chat/Swift/TUIKitDemo/TUIKitDemo.xcworkspace"
        XCODE_SCHEME: "TUIKitDemo"
        BUNDLE_ID: "com.app.weiliao2027"
        DEVELOPMENT_TEAM: "S5SAS3UH9"
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          cd Chat/Chat/Swift/TUIKitDemo
          pod install --repo-update
      - name: Build IPA
        script: |
          cd Chat/Chat/Swift/TUIKitDemo
          xcodebuild clean archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TUIKitDemo.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM
      - name: Export IPA
        script: |
          cd Chat/Chat/Swift/TUIKitDemo
          xcodebuild -exportArchive \
            -archivePath build/TUIKitDemo.xcarchive \
            -exportPath build \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key><string>app-store</string>
          <key>teamID</key><string>S5SAS3UH9</string>
          <key>compileBitcode</key><false/>
          </dict>
          </plist>')
    artifacts:
      - Chat/Chat/Swift/TUIKitDemo/build/*.ipa
    publishing:
      email:
        recipients:
          - xia15686666659@163.com
