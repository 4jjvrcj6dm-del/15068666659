workflows:
  ios-workflow:
    name: iOS Build
    environment:
      vars:
        XCODE_WORKSPACE: "TUIKitDemo.xcworkspace"
        XCODE_SCHEME: "TUIKitDemo"
        APP_DIR: "Chat/Chat/Swift/TUIKitDemo"
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          cd $APP_DIR
          pod install --repo-update
      - name: Build Archive
        script: |
          cd $APP_DIR
          xcodebuild clean archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TUIKitDemo.xcarchive \
            -allowProvisioningUpdates
      - name: Export IPA
        script: |
          cd $APP_DIR
          /usr/libexec/PlistBuddy -c "Add method string app-store" export.plist
          /usr/libexec/PlistBuddy -c "Add compileBitcode bool false" export.plist
          xcodebuild -exportArchive \
            -archivePath build/TUIKitDemo.xcarchive \
            -exportPath build \
            -exportOptionsPlist export.plist \
            -allowProvisioningUpdates
    artifacts:
      - $APP_DIR/build/*.ipa
    publishing:
      email:
        recipients:
          - xia15686666659@163.com
