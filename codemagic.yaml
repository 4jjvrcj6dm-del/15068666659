workflows:
  ios-workflow:
    name: iOS Build
    environment:
      vars:
        XCODE_WORKSPACE: "TUIKitDemo.xcworkspace"
        XCODE_SCHEME: "TUIKitDemo"
        APP_DIR: "Chat/Chat/Swift/TUIKitDemo"
        DEVELOPMENT_TEAM: "S5SAS3UH9"
      xcode: latest
      groups:
        - appstore
    scripts:
      - name: Install CocoaPods
        script: |
          cd $APP_DIR
          pod install --repo-update
      - name: Build & Archive
        script: |
          cd $APP_DIR
          xcodebuild clean archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TUIKitDemo.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            CODE_SIGN_STYLE=Automatic
      - name: Export IPA
        script: |
          cd $APP_DIR
          plutil -create xml1 exportOptions.plist
          defaults write $PWD/exportOptions.plist method app-store
          defaults write $PWD/exportOptions.plist teamID $DEVELOPMENT_TEAM
          defaults write $PWD/exportOptions.plist compileBitcode -bool false
          xcodebuild -exportArchive \
            -archivePath build/TUIKitDemo.xcarchive \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates
    artifacts:
      - $APP_DIR/build/*.ipa
    publishing:
      email:
        recipients:
          - xia15686666659@163.com
