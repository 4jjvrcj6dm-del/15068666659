# iOS App 自动化构建 IPA
# ========================
# 手动触发: Actions -> iOS Build -> Run workflow
# 前置条件 - GitHub Secrets:
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY

name: iOS Build

on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: '跳过上传（仅构建测试）'
        type: boolean
        default: false

env:
  PROJECT_PATH: Chat/Chat/Swift/TUIKitDemo
  WORKSPACE_NAME: TUIKitDemo.xcworkspace
  SCHEME_NAME: TUIKitDemo

jobs:
  build:
    name: Build & Upload
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Install Pods
        run: |
          cd ${{ env.PROJECT_PATH }}
          pod install --repo-update

      - name: Import App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/.fastlane
          echo "$APP_STORE_CONNECT_KEY" > ~/.fastlane/app_store_connect_key.p8
          chmod 600 ~/.fastlane/app_store_connect_key.p8

      - name: Build Archive
        run: |
          cd ${{ env.PROJECT_PATH }}
          xcodebuild clean archive \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/TUIKitDemo.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=S5SAS3UH9

      - name: Export IPA
        run: |
          cd ${{ env.PROJECT_PATH }}
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>S5SAS3UH9</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TUIKitDemo.xcarchive" \
            -exportPath "$RUNNER_TEMP/IPA" \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA
        if: ${{ !inputs.skip_upload }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/IPA/TUIKitDemo.ipa" \
            -u "@keychain:AC_PASSWORD" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUIKitDemo-IPA
          path: ${{ runner.temp }}/IPA/TUIKitDemo.ipa
          retention-days: 30
