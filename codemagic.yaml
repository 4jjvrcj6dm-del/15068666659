workflows:
  ios-workflow:
    name: iOS Build
    environment:
      vars:
        XCODE_WORKSPACE: "TUIKitDemo.xcworkspace"
        XCODE_SCHEME: "TUIKitDemo"
        APP_DIR: "Chat/Chat/Swift/TUIKitDemo"
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          cd $APP_DIR
          pod install --repo-update
      - name: Install API Key
        script: |
          mkdir -p ~/private_keys
          cat > ~/private_keys/AuthKey_5B94HC797Q.p8 << 'KEYEOF'
-----BEGIN PRIVATE KEY-----
MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgaQirVRh4iH37udOy
XuIYNUDHDvPxm7mWC06Gbnvi75agCgYIKoZIzj0DAQehRANCAAQPR45DbXOxPBfL
LqX/K8vKeJADZwOZSnuKXgfXHHdxKxPpRqUrT8lf0JVhQODCgto5krQpK4HDESAi
qn42B3UN
-----END PRIVATE KEY-----
KEYEOF
          chmod 600 ~/private_keys/AuthKey_5B94HC797Q.p8
      - name: Build Archive
        script: |
          cd $APP_DIR
          xcodebuild clean archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TUIKitDemo.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_5B94HC797Q.p8 \
            -authenticationKeyID 5B94HC797Q \
            -authenticationKeyIssuerID 20bea6d9-e9af-4805-8ed1-84286ef63d49
      - name: Export IPA
        script: |
          cd $APP_DIR
          /usr/libexec/PlistBuddy -c "Add method string app-store" export.plist
          /usr/libexec/PlistBuddy -c "Add compileBitcode bool false" export.plist
          xcodebuild -exportArchive \
            -archivePath build/TUIKitDemo.xcarchive \
            -exportPath build \
            -exportOptionsPlist export.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_5B94HC797Q.p8 \
            -authenticationKeyID 5B94HC797Q \
            -authenticationKeyIssuerID 20bea6d9-e9af-4805-8ed1-84286ef63d49
    artifacts:
      - $APP_DIR/build/*.ipa
    publishing:
      email:
        recipients:
          - xia15686666659@163.com
